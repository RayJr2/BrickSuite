name: macOS architecture artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }} (13.0+)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      ARCH: ${{ matrix.arch }}
      RUNNER_LABEL: ${{ matrix.runner }}
      SOURCE_SHA: ${{ github.sha }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      JOBS: '3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Select and verify toolchain and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          xcodebuild -version
          xcodebuild -version | head -1 | grep -Fx 'Xcode 16.4'
          /usr/bin/clang --version
          xcrun --sdk macosx --show-sdk-version
          sw_vers
          echo "Source SHA: $SOURCE_SHA; runner: $RUNNER_LABEL; architecture: $ARCH"
          python -m pip install cmake==3.31.6 ninja==1.11.1.3
          echo "CMAKE=$(command -v cmake)" >> "$GITHUB_ENV"
          echo "NINJA=$(command -v ninja)" >> "$GITHUB_ENV"
          echo "DEPS_ROOT=$RUNNER_TEMP/bricksuite-deps" >> "$GITHUB_ENV"
          echo "QT_SOURCE=$RUNNER_TEMP/bricksuite-sources/qt-everywhere-src-6.10.3" >> "$GITHUB_ENV"
          echo "OPENSSL_SOURCE=$RUNNER_TEMP/bricksuite-sources/openssl-3.6.4" >> "$GITHUB_ENV"
      - name: Validate release gate regression tests
        run: python -m unittest discover -s deployment/macos -p test_release_tools.py -v
      - name: Bootstrap verified sources
        run: python deployment/macos/bootstrap_sources.py "$RUNNER_TEMP/bricksuite-sources"
      - name: Build and install Qt 6.10.3 and OpenSSL 3.6.4 for macOS 13
        run: bash deployment/macos/build_dependencies.sh
      - name: Build, test, package, audit, probe and archive
        run: python deployment/macos/ci_release.py --build build/m39-ci --output dist/macos
      - name: Upload validated architecture artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bricksuite-macos-${{ matrix.arch }}
          path: dist/macos/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Record artifact link
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: echo "Validated $ARCH artifact — $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure diagnostics (never a release archive)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-diagnostics-${{ matrix.arch }}
          path: build/m39-ci/reports/
          if-no-files-found: ignore
          retention-days: 14
